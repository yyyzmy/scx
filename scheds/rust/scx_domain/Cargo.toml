[package]
name = "scx_domain"
version = "1.1.0"
authors = ["Yang Chen <yangchen145@huawei.com>", "Huawei"]
edition = "2021"
description = "A domain scheduler based on sched_ext"
license = "GPL-2.0-only"

[dependencies]
anyhow = "1.0.65"
clap = { version = "4.5.28", features = ["derive", "env", "unicode", "wrap_help"] }
libbpf-rs = "=0.26.1"
ctrlc = { version = "3.1", features = ["termination"] }
libc = "0.2.137"
log = "0.4.17"
simplelog = "0.12"
num_cpus = "1"

scx_bpf_compat = { path = "../../../rust/scx_bpf_compat", version = "1.1.0" }
scx_stats = { path = "../../../rust/scx_stats", version = "1.1.0" }
scx_stats_derive = { path = "../../../rust/scx_stats/scx_stats_derive", version = "1.1.0" }
scx_utils = { path = "../../../rust/scx_utils", version = "1.1.0" }

[build-dependencies]
scx_cargo = { path = "../../../rust/scx_cargo", version = "1.1.0" }
